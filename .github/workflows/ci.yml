name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Every job builds with the toolchain rust-toolchain.toml names, never the
# latest stable release, so a new release cannot fail a job on its own.
jobs:
  check:
    name: Check, Clippy, Docs & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check (workspace)
        run: cargo fmt --all -- --check
      - name: cargo clippy (all features, lib + tests)
        run: cargo clippy -p instancy --all-features --lib --tests -- -D warnings
      - name: Build examples (all features)
        run: cargo build -p instancy --examples --all-features
      # Release builds compile out debug-only code (the progress checker), so
      # code used only there must not leave dead code behind. This builds the
      # library in release with default features, and the test checks that
      # the progress flight recorder is compiled out of that build.
      - name: Flight recorder absent from release builds
        run: cargo test -p instancy --release --test trace_release
      - name: cargo doc (all features)
        run: cargo doc -p instancy --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: cargo build (no default features)
        run: cargo build -p instancy --no-default-features
      - name: cargo build (no default features, release)
        run: cargo build -p instancy --no-default-features --release
      # The library's own tests need the `test-utils` feature.
      - name: Tests (no default features)
        run: cargo nextest run -p instancy --no-default-features --features test-utils --lib --tests --profile ci --no-tests fail

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Every run records the progress flight recorder; a progress failure
      # dumps its traces here (uploaded below when the job fails).
      INSTANCY_TRACE_DIR: ${{ github.workspace }}/trace-dumps
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Tests
        run: cargo nextest run -p instancy --all-features --lib --tests --profile ci --no-tests fail
      - name: Doc tests
        run: cargo test -p instancy --doc --all-features
      - name: Upload progress traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: progress-traces-test
          path: ${{ github.workspace }}/trace-dumps
          if-no-files-found: ignore
          retention-days: 14

  shuttle:
    name: Schedule tests (Shuttle)
    runs-on: ubuntu-latest
    env:
      # The cfg substitutes Shuttle's models for the tested synchronization.
      RUSTFLAGS: "-Dwarnings --cfg instancy_shuttle"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Toolchain
        run: rustc -Vv
      # A failure prints the schedule that reproduces it.
      - name: Shuttle schedule tests
        run: |
          set -o pipefail
          unset SHUTTLE_RANDOM_SEED
          cargo nextest run -p instancy --locked --lib \
            --no-default-features --features tracing,transport,test-utils --profile ci \
            --test-threads 1 --no-tests fail --failure-output immediate-final \
            -E 'test(/_shuttle::/)' 2>&1 | tee shuttle.log
      - name: Upload Shuttle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-log
          path: shuttle.log
          if-no-files-found: ignore
          retention-days: 14

  loom:
    name: Model-checked tests (Loom)
    runs-on: ubuntu-latest
    env:
      # The cfg substitutes Loom's models for the tested synchronization.
      RUSTFLAGS: "-Dwarnings --cfg instancy_loom"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Toolchain
        run: rustc -Vv
      # The tests set Loom's bounds themselves and fail if LOOM_* overrides them.
      - name: Loom model tests
        run: |
          set -o pipefail
          cargo nextest run -p instancy --locked --lib \
            --no-default-features --features tracing,transport,test-utils --profile ci \
            --test-threads 1 --no-tests fail --failure-output immediate-final \
            -E 'test(/_loom::/)' 2>&1 | tee loom.log
      - name: Upload Loom log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loom-log
          path: loom.log
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Multi-process harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # dactor's build script runs prost-build, which needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Clippy (harness)
        run: cargo clippy -p instancy-integration --all-targets -- -D warnings
      - name: Multi-process tests
        run: cargo nextest run -p instancy-integration --profile ci --no-tests fail

  conformance:
    name: Full conformance matrix
    runs-on: ubuntu-latest
    env:
      # A case with an unexpected outcome dumps its traces here, including
      # one that passes on a later attempt (reported as flaky, and the job
      # passes): the dumps are uploaded whenever there are any.
      INSTANCY_TRACE_DIR: ${{ github.workspace }}/trace-dumps
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The `test` job runs a subset; this runs all of it, in parallel with
      # the other jobs.
      - name: Progress conformance matrix (full)
        run: cargo test -p instancy --all-features --test progress_conformance -- --ignored --exact --test-threads=1 full_conformance_matrix
      - name: Upload progress traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-traces-conformance
          path: ${{ github.workspace }}/trace-dumps
          if-no-files-found: ignore
          retention-days: 14

  # Every order in which the lifecycle coordinator's events can reach it
  # (runtime::cluster_lifecycle::exhaustive), in release: eleven
  # configurations, in two parts that run at the same time. A part runs two
  # lanes at once, and a lane runs its configurations one after another, each
  # in its own process, so that the log shows each one's time and peak memory.
  # The lanes are balanced by time, and the largest configurations of a
  # part's two lanes need about 10 GB together, of the runner's 16. The others
  # are run by hand (docs/testing/nextest.md).
  lifecycle:
    name: Lifecycle coordinator, every order of events (${{ matrix.part }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    defaults:
      run:
        shell: bash
    env:
      PART: ${{ matrix.part }}
      LANE_1A: shared_two_workers_two_channels shared_one_worker_two_channels
      LANE_1B: >-
        dedicated_one_worker_two_channels dedicated_one_worker_one_channel_inbound
        shared_one_worker_one_channel
      LANE_2A: >-
        shared_split_one_worker_two_channels shared_two_workers_one_channel
        dedicated_one_worker_one_channel
      LANE_2B: >-
        shared_split_one_worker_one_channel_inbound
        shared_split_one_worker_one_channel shared_one_worker_one_channel_inbound
      BY_HAND: >-
        shared_one_worker_two_channels_inbound shared_two_workers_one_channel_inbound
        shared_split_two_workers_one_channel shared_split_two_workers_two_channels
        shared_split_one_worker_two_channels_inbound
        shared_split_two_workers_one_channel_inbound
        dedicated_two_workers_one_channel dedicated_two_workers_two_channels
        dedicated_one_worker_two_channels_inbound
        dedicated_two_workers_one_channel_inbound
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: |
          cargo test -p instancy --release --all-features --lib --no-run \
            --message-format json-render-diagnostics \
            | jq -r 'select(.executable != null and .target.kind == ["lib"]) | "TESTS=" + .executable' \
            >> "$GITHUB_ENV"
      # A configuration added to the check goes in a lane, or in BY_HAND.
      - name: Every configuration in one lane, or run by hand
        run: |
          # Listed first: a failure inside diff's <(...) would go unnoticed.
          listed=$("$TESTS" --list --ignored cluster_lifecycle::exhaustive:: \
            | sed -n 's/^runtime::cluster_lifecycle::exhaustive::\(.*\): test$/\1/p' | sort)
          diff <(printf '%s\n' $LANE_1A $LANE_1B $LANE_2A $LANE_2B $BY_HAND | sort) \
            <(printf '%s\n' "$listed")
      - name: Every order of events
        run: |
          lane() {
            local status=0 config
            for config in "$@"; do
              if ! /usr/bin/time -f "%e s, at most %M KB resident" "$TESTS" \
                --include-ignored --nocapture --exact \
                "runtime::cluster_lifecycle::exhaustive::$config" 2>&1 \
                | sed -u "s/^/$config: /"; then
                status=1
              fi
            done
            return "$status"
          }
          first=LANE_${PART}A second=LANE_${PART}B
          lane ${!first} & a=$!
          lane ${!second} & b=$!
          status=0
          wait "$a" || status=1
          wait "$b" || status=1
          exit "$status"
