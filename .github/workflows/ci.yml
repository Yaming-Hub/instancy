name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Every job builds with the toolchain rust-toolchain.toml names, never the
# latest stable release, so a new release cannot fail a job on its own.
jobs:
  check:
    name: Check, Clippy, Docs & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check (workspace)
        run: cargo fmt --all -- --check
      - name: cargo clippy (all features, lib + tests)
        run: cargo clippy -p instancy --all-features --lib --tests -- -D warnings
      - name: Build examples (all features)
        run: cargo build -p instancy --examples --all-features
      # Release builds compile out debug-only code (the progress checker), so
      # code used only there must not leave dead code behind. This builds the
      # library in release with default features, and the test checks that
      # the progress flight recorder is compiled out of that build.
      - name: Flight recorder absent from release builds
        run: cargo test -p instancy --release --test trace_release
      - name: cargo doc (all features)
        run: cargo doc -p instancy --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: cargo build (no default features)
        run: cargo build -p instancy --no-default-features
      - name: cargo build (no default features, release)
        run: cargo build -p instancy --no-default-features --release
      # The library's own tests need the `test-utils` feature.
      - name: Tests (no default features)
        run: cargo nextest run -p instancy --no-default-features --features test-utils --lib --tests --profile ci --no-tests fail

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Every run records the progress flight recorder; a progress failure
      # dumps its traces here (uploaded below when the job fails).
      INSTANCY_TRACE_DIR: ${{ github.workspace }}/trace-dumps
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Tests
        run: cargo nextest run -p instancy --all-features --lib --tests --profile ci --no-tests fail
      - name: Doc tests
        run: cargo test -p instancy --doc --all-features
      - name: Upload progress traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: progress-traces-test
          path: ${{ github.workspace }}/trace-dumps
          if-no-files-found: ignore
          retention-days: 14

  shuttle:
    name: Schedule tests (Shuttle)
    runs-on: ubuntu-latest
    env:
      # The cfg substitutes Shuttle's models for the tested synchronization.
      RUSTFLAGS: "-Dwarnings --cfg instancy_shuttle"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Toolchain
        run: rustc -Vv
      # A failure prints the schedule that reproduces it.
      - name: Shuttle schedule tests
        run: |
          set -o pipefail
          unset SHUTTLE_RANDOM_SEED
          cargo nextest run -p instancy --locked --lib \
            --no-default-features --features tracing,transport,test-utils --profile ci \
            --test-threads 1 --no-tests fail --failure-output immediate-final \
            -E 'test(/_shuttle::/)' 2>&1 | tee shuttle.log
      - name: Upload Shuttle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-log
          path: shuttle.log
          if-no-files-found: ignore
          retention-days: 14

  loom:
    name: Model-checked tests (Loom)
    runs-on: ubuntu-latest
    env:
      # The cfg substitutes Loom's models for the tested synchronization.
      RUSTFLAGS: "-Dwarnings --cfg instancy_loom"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Toolchain
        run: rustc -Vv
      # The tests set Loom's bounds themselves and fail if LOOM_* overrides them.
      - name: Loom model tests
        run: |
          set -o pipefail
          cargo nextest run -p instancy --locked --lib \
            --no-default-features --features tracing,transport,test-utils --profile ci \
            --test-threads 1 --no-tests fail --failure-output immediate-final \
            -E 'test(/_loom::/)' 2>&1 | tee loom.log
      - name: Upload Loom log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loom-log
          path: loom.log
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Multi-process harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # dactor's build script runs prost-build, which needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Clippy (harness)
        run: cargo clippy -p instancy-integration --all-targets -- -D warnings
      - name: Multi-process tests
        run: cargo nextest run -p instancy-integration --profile ci --no-tests fail

  conformance:
    name: Full conformance matrix
    runs-on: ubuntu-latest
    env:
      # A case with an unexpected outcome dumps its traces here, including
      # one that passes on a later attempt (reported as flaky, and the job
      # passes): the dumps are uploaded whenever there are any.
      INSTANCY_TRACE_DIR: ${{ github.workspace }}/trace-dumps
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The `test` job runs a subset; this runs all of it, in parallel with
      # the other jobs.
      - name: Progress conformance matrix (full)
        run: cargo test -p instancy --all-features --test progress_conformance -- --ignored --exact --test-threads=1 full_conformance_matrix
      - name: Upload progress traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-traces-conformance
          path: ${{ github.workspace }}/trace-dumps
          if-no-files-found: ignore
          retention-days: 14

  # Every order in which the lifecycle coordinator's events can reach it
  # (runtime::cluster_lifecycle::exhaustive), in release: eleven
  # configurations, in three parts that run at the same time. A part runs two
  # lanes at once, and a lane runs its configurations one after another, each
  # in its own process, so that the log shows each one's time and peak memory.
  # The lanes are balanced by time, and the largest configurations of a
  # part's two lanes need at most about 12 GB together, of the runner's 16
  # (the second lane's largest runs first, while the first's is half-way).
  # The others are run by hand (docs/testing/nextest.md).
  lifecycle:
    name: Lifecycle coordinator, every order of events (${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      PART: ${{ matrix.part }}
      LANE_1A: shared_two_workers_two_channels
      LANE_1B: >-
        dedicated_one_worker_two_channels shared_one_worker_two_channels
        shared_one_worker_one_channel
      LANE_2A: shared_split_one_worker_two_channels
      LANE_2B: >-
        dedicated_one_worker_one_channel_inbound shared_split_one_worker_one_channel
        shared_two_workers_one_channel
      LANE_3A: shared_split_one_worker_one_channel_inbound
      LANE_3B: >-
        shared_one_worker_one_channel_inbound dedicated_one_worker_one_channel
      BY_HAND: >-
        shared_one_worker_two_channels_inbound shared_two_workers_one_channel_inbound
        shared_split_two_workers_one_channel shared_split_two_workers_two_channels
        shared_split_one_worker_two_channels_inbound
        shared_split_two_workers_one_channel_inbound
        dedicated_two_workers_one_channel dedicated_two_workers_two_channels
        dedicated_one_worker_two_channels_inbound
        dedicated_two_workers_one_channel_inbound
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: |
          cargo test -p instancy --release --all-features --lib --no-run \
            --message-format json-render-diagnostics \
            | jq -r 'select(.executable != null and .target.kind == ["lib"]) | "TESTS=" + .executable' \
            >> "$GITHUB_ENV"
      # A configuration added to the check goes in a lane, or in BY_HAND.
      - name: Every configuration in one lane, or run by hand
        run: |
          # Listed first: a failure inside diff's <(...) would go unnoticed.
          listed=$("$TESTS" --list --ignored cluster_lifecycle::exhaustive:: \
            | sed -n 's/^runtime::cluster_lifecycle::exhaustive::\(.*\): test$/\1/p' | sort)
          diff <(printf '%s\n' $LANE_1A $LANE_1B $LANE_2A $LANE_2B $LANE_3A $LANE_3B $BY_HAND | sort) \
            <(printf '%s\n' "$listed")
      - name: Every order of events
        run: |
          lane() {
            local status=0 config
            for config in "$@"; do
              if ! /usr/bin/time -f "%e s, at most %M KB resident" "$TESTS" \
                --include-ignored --nocapture --exact \
                "runtime::cluster_lifecycle::exhaustive::$config" 2>&1 \
                | sed -u "s/^/$config: /"; then
                status=1
              fi
            done
            return "$status"
          }
          first=LANE_${PART}A second=LANE_${PART}B
          lane ${!first} & a=$!
          lane ${!second} & b=$!
          status=0
          wait "$a" || status=1
          wait "$b" || status=1
          exit "$status"

  # A pull request may only take counterexamples out of the lifecycle check's
  # golden files: an identity it adds is a regression, unless the model itself
  # changed, which bumps MODEL_VERSION in exhaustive.rs (docs/testing/nextest.md).
  # A count is of states, and a change to the machine can raise it with no new
  # counterexample, so a count that rises is only reported. Whether a bump or
  # an identity taken out is justified is for review. A re-run checks the same
  # merge commit: a newer base needs a new push.
  golden-files:
    name: Lifecycle golden files only shrink
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its parents: ^1 is the base.
          fetch-depth: 2
      - name: No identity added without a new MODEL_VERSION
        run: |
          shopt -s inherit_errexit
          export LC_ALL=C
          dir=instancy/src/runtime/cluster_lifecycle/exhaustive
          git rev-parse --verify --quiet HEAD^2 > /dev/null \
            || { echo "::error::expected the pull request's merge commit"; exit 1; }
          # Reads the golden files at commit $1 into $2.ids, one line per
          # identity ("<file> <property> <identity>"), and $2.counts, one line
          # per broken property ("<file>:<property> <violations>"). A line the
          # tests do not write that way fails the job.
          golden() {
            local file
            git ls-tree --name-only "$1" "$dir/" > "$2.files"
            : > "$2.ids"
            : > "$2.counts"
            while read -r file; do
              case $file in *.golden) ;; *) continue ;; esac
              git show "$1:$file" > "$2.text"
              awk -F ' [|] ' -v file="${file##*/}" -v ids="$2.ids" -v counts="$2.counts" '
                /^\/\// || /^$/ { next }
                /^\[[A-Za-z]+\]$/ { property = substr($0, 2, length($0) - 2); next }
                property != "" && /^[0-9a-f]+$/ && length($0) == 12 {
                  print file, property, $0 >> ids; next
                }
                property == "" && NF >= 4 && $1 ~ /^[A-Za-z]+$/ && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {
                  print file ":" $1, $2 >> counts; next
                }
                {
                  print "::error::" file ", line " NR ", is not as the tests write it: " $0
                  bad = 1
                }
                END { exit bad }' "$2.text"
            done < "$2.files"
            sort -o "$2.ids" "$2.ids"
            sort -o "$2.counts" "$2.counts"
          }
          # Sets v to the MODEL_VERSION exhaustive.rs declares at commit $1, or
          # to 0 if it declares none (before there was one).
          version() {
            local n status=0
            git show "$1:$dir.rs" > version.rs
            # grep exits 1 when nothing matches; anything above that is an error.
            n=$(grep -c 'const MODEL_VERSION' version.rs) || status=$?
            [ "$status" -le 1 ] || { echo "::error::$1: cannot read exhaustive.rs"; exit 1; }
            case $n in
              0) v=0 ;;
              1)
                v=$(sed -nE 's#^const MODEL_VERSION: u32 = ([0-9]+);[[:space:]]*(//.*)?$#\1#p' \
                  version.rs)
                [ -n "$v" ] || {
                  echo "::error::$1: MODEL_VERSION is not declared as" \
                    "const MODEL_VERSION: u32 = <number>;"
                  exit 1
                } ;;
              *) echo "::error::$1: exhaustive.rs declares MODEL_VERSION more than once"; exit 1 ;;
            esac
          }
          version HEAD^1
          old=$v
          version HEAD
          new=$v
          [ "$new" -ne 0 ] || { echo "::error::exhaustive.rs no longer declares MODEL_VERSION"; exit 1; }
          golden HEAD^1 base
          golden HEAD head
          comm -13 base.ids head.ids > added.ids
          removed=$(comm -23 base.ids head.ids | wc -l)
          added=$(wc -l < added.ids)
          echo "Identities taken out: $removed; added: $added; MODEL_VERSION: $old -> $new"
          join base.counts head.counts \
            | awk '$3 > $2 { print "Note: " $1 " violations rose from " $2 " to " $3 }'
          if [ "$added" -gt 0 ]; then
            if [ "$old" -ne "$new" ]; then
              echo "MODEL_VERSION changed: the identities added are accepted"
            else
              echo "::error::This pull request adds counterexamples to the lifecycle check's" \
                "golden files. Fix the regression: only a change to the model may add one," \
                "and it bumps MODEL_VERSION in exhaustive.rs."
              head -n 50 added.ids
              exit 1
            fi
          fi
