name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check, Clippy, Docs & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check (workspace)
        run: cargo fmt --all -- --check
      - name: cargo clippy (all features, lib + tests)
        run: cargo clippy -p instancy --all-features --lib --tests -- -D warnings
      - name: Build examples (all features)
        run: cargo build -p instancy --examples --all-features
      # Release builds compile out debug-only code (the progress checker), so
      # code used only there must not leave dead code behind. This builds the
      # library in release with default features, and the test checks that
      # the progress flight recorder is compiled out of that build.
      - name: Flight recorder absent from release builds
        run: cargo test -p instancy --release --test trace_release
      - name: cargo doc (all features)
        run: cargo doc -p instancy --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  no-default-features:
    name: No default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: cargo build (no default features)
        run: cargo build -p instancy --no-default-features
      - name: cargo build (no default features, release)
        run: cargo build -p instancy --no-default-features --release
      # The library's own tests need the `test-utils` feature.
      - name: Tests (no default features)
        run: cargo nextest run -p instancy --no-default-features --features test-utils --lib --tests --profile ci --no-tests fail

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Every run records the progress flight recorder; a progress failure
      # dumps its traces here (uploaded below when the job fails).
      INSTANCY_TRACE_DIR: ${{ github.workspace }}/trace-dumps
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Tests
        run: cargo nextest run -p instancy --all-features --lib --tests --profile ci --no-tests fail
      - name: Doc tests
        run: cargo test -p instancy --doc --all-features
      - name: Upload progress traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: progress-traces-test
          path: ${{ github.workspace }}/trace-dumps
          if-no-files-found: ignore
          retention-days: 14

  shuttle:
    name: Schedule tests (Shuttle)
    runs-on: ubuntu-latest
    env:
      # The cfg substitutes Shuttle's models for the tested synchronization.
      RUSTFLAGS: "-Dwarnings --cfg instancy_shuttle"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Toolchain
        run: rustc -Vv
      # A failure prints the schedule that reproduces it.
      - name: Shuttle schedule tests
        run: |
          set -o pipefail
          unset SHUTTLE_RANDOM_SEED
          cargo nextest run -p instancy --locked --lib \
            --no-default-features --features tracing,transport,test-utils --profile ci \
            --test-threads 1 --no-tests fail --failure-output immediate-final \
            -E 'test(/_shuttle::/)' 2>&1 | tee shuttle.log
      - name: Upload Shuttle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-log
          path: shuttle.log
          if-no-files-found: ignore
          retention-days: 14

  loom:
    name: Model-checked tests (Loom)
    runs-on: ubuntu-latest
    env:
      # The cfg substitutes Loom's models for the tested synchronization.
      RUSTFLAGS: "-Dwarnings --cfg instancy_loom"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Toolchain
        run: rustc -Vv
      # The tests set Loom's bounds themselves and fail if LOOM_* overrides them.
      - name: Loom model tests
        run: |
          set -o pipefail
          cargo nextest run -p instancy --locked --lib \
            --no-default-features --features tracing,transport,test-utils --profile ci \
            --test-threads 1 --no-tests fail --failure-output immediate-final \
            -E 'test(/_loom::/)' 2>&1 | tee loom.log
      - name: Upload Loom log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loom-log
          path: loom.log
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Multi-process harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # dactor's build script runs prost-build, which needs protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2 pin
        with:
          tool: nextest@0.9.150
      - name: Clippy (harness)
        run: cargo clippy -p instancy-integration --all-targets -- -D warnings
      - name: Multi-process tests
        run: cargo nextest run -p instancy-integration --profile ci --no-tests fail

  conformance:
    name: Full conformance matrix
    runs-on: ubuntu-latest
    env:
      # A case with an unexpected outcome dumps its traces here, including
      # one that passes on a later attempt (reported as flaky, and the job
      # passes): the dumps are uploaded whenever there are any.
      INSTANCY_TRACE_DIR: ${{ github.workspace }}/trace-dumps
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `test` job runs a subset; this runs all of it, in parallel with
      # the other jobs.
      - name: Progress conformance matrix (full)
        run: cargo test -p instancy --all-features --test progress_conformance -- --ignored --exact --test-threads=1 full_conformance_matrix
      # Every order of the lifecycle machine's events (up to 27 million
      # states a configuration), in release, where it takes minutes. The two
      # largest configurations need 8 GB and are run by hand.
      - name: Lifecycle machine, every order of events
        run: cargo test -p instancy --release --all-features --lib -- --include-ignored --test-threads 2 cluster_lifecycle::exhaustive:: --skip two_workers_two_channels
      - name: Upload progress traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-traces-conformance
          path: ${{ github.workspace }}/trace-dumps
          if-no-files-found: ignore
          retention-days: 14
